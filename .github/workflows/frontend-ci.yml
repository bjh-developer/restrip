name: Frontend CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            frontend:
              - "src/**"
              - "next.config.*"
              - "tailwind.config.*"
              - "tsconfig.json"
              - "package.json"
              - "package-lock.json"

  lint-and-typecheck:
    name: Lint & Type Check (internal)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings=0

  build:
    name: Build Check (internal)
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-typecheck]
    if: |
      always() &&
      github.actor != 'dependabot[bot]' &&
      needs.detect-changes.outputs.frontend == 'true' &&
      (needs.lint-and-typecheck.result == 'success' || needs.lint-and-typecheck.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}

  npm-audit:
    name: npm Audit (internal)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm audit --audit-level=high

  # ── Status reporter jobs (always run, match branch protection check names) ──

  lint-status:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-typecheck]
    if: always()
    env:
      ACTOR: ${{ github.actor }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
      LINT_RESULT: ${{ needs.lint-and-typecheck.result }}
    steps:
      - name: Report status
        run: |
          if [[ "$ACTOR" == "dependabot[bot]" ]]; then
            echo "Dependabot PR — skipping lint"
          elif [[ "$FRONTEND_CHANGED" != "true" ]]; then
            echo "No frontend changes — skipping"
          elif [[ "$LINT_RESULT" == "success" ]]; then
            echo "Lint passed"
          else
            echo "Lint failed"
            exit 1
          fi

  build-status:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: always()
    env:
      ACTOR: ${{ github.actor }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Report status
        run: |
          if [[ "$ACTOR" == "dependabot[bot]" ]]; then
            echo "Dependabot PR — skipping build"
          elif [[ "$FRONTEND_CHANGED" != "true" ]]; then
            echo "No frontend changes — skipping"
          elif [[ "$BUILD_RESULT" == "success" ]]; then
            echo "Build passed"
          else
            echo "Build failed"
            exit 1
          fi

  audit-status:
    name: npm Audit
    runs-on: ubuntu-latest
    needs: [detect-changes, npm-audit]
    if: always()
    env:
      ACTOR: ${{ github.actor }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
      AUDIT_RESULT: ${{ needs.npm-audit.result }}
    steps:
      - name: Report status
        run: |
          if [[ "$ACTOR" == "dependabot[bot]" ]]; then
            echo "Dependabot PR — skipping audit"
          elif [[ "$FRONTEND_CHANGED" != "true" ]]; then
            echo "No frontend changes — skipping"
          elif [[ "$AUDIT_RESULT" == "success" ]]; then
            echo "Audit passed"
          else
            echo "Audit failed"
            exit 1
          fi