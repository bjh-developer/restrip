name: RunPod Handler CI

on:
  pull_request:
    branches: [main]
    paths:
      - "runpod/**"
  push:
    branches: [main]
    paths:
      - "runpod/**"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r runpod/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install ruff pytest pytest-cov

      - name: Lint with ruff
        run: ruff check runpod/

      - name: Run tests
        run: pytest runpod/tests/ -v --cov=runpod/ --cov-report=term
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
