name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "styles/**"
      - "public/**"
      - "*.css"
      - "next.config.*"
      - "tailwind.config.*"

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for Vercel preview deployment
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        id: wait-for-preview
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 120
          check_interval: 5

      - name: Run Lighthouse CI
        run: npx lhci autorun --collect.url=${{ steps.wait-for-preview.outputs.url }}
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
